<!DOCTYPE html>
{% load static %}
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TransHistory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>{% block title %}Title{% endblock %}</title>
    <link href="{% static 'asserts/css/base_A.css' %}" rel="stylesheet" />
    {% block extra_head %}{% endblock %}
</head>

<body>
    <header>
        <div class="container nav">
            <a class="brand" href="#">
                <img src="{% static 'asserts/images/logo-trans4tm1.png' %}" alt="logo" style="max-height: 30px" />
                <!-- <span>TransHistory</span> -->
            </a>
            <button class="menu-toggle" aria-label="Toggle Menu">☰</button>
            <nav class="menu" aria-label="Primary">
                <a href="/">主页</a>
                <a href="/history">历史事件</a>
                <a href="/person">人物史</a>
                <a href="/gallery">艺术史</a>
                <a href="/theory">理论史</a>
                <a class="cta" href="/">关于我们</a>
            </nav>
        </div>
    </header>
    <main class="container">
        {% block main %}{% endblock %}
    </main>
    <footer class="container">
        <div class="footer">
            <div class="col-1">
                <h3>快速链接</h3>
                <a href="/about_submission" target="_blank">关于投稿</a>
                <a href="/about_us" target="_blank">关于我们</a>
                <a href="/dlog" target="_blank">开发日志</a>
            </div>
            <div class="col-2">
                <h3>搜索栏</h3>
                <form>
                    <input placeholder="档案搜索" required="" type="type" />
                    <br />
                    <button type="submit">搜索</button>
                </form>
            </div>
            <div class="col-3">
                <h3>联系我们</h3>
                <p2>Email:xxxxx@xx.xx</p2>
                <br /><br />
                <p2>微信公众号：XXXX</p2>
                <br /><br />
                <p2>微博账号：XXXX</p2>
            </div>
        </div>
    </footer>
    <script>
        const toggle = document.querySelector('.menu-toggle');
        const menu = document.querySelector('.menu');
        toggle.addEventListener('click', () => {
            menu.classList.toggle('open');
        });
    </script>
</body>
