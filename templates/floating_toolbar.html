<div class="ce-floating-toolbar">
    <div class="floating-toolbar-content">
        <!-- 竖直分割 -->
        <button class="floating-btn" data-action="split-vertical" title="竖直分割">┃</button>
        
        <!-- 水平分割 -->
        <button class="floating-btn" data-action="split-horizontal" title="水平分割">━━</button>
        
        <!-- 选择节点 -->
        <button class="floating-btn" data-action="choose-node" title="从节点库选择">选择节点</button>
        
        <!-- 上传图片 -->
        <label class="floating-file-btn">
            <input type="file" accept="image/*" data-action="upload" />
            插入图片
        </label>
        
        <!-- 删除图片 -->
        <button class="floating-btn" data-action="remove" title="移除区域内容">🗑</button>
        
        <!-- 删除区域 -->
        <button class="floating-btn" data-action="delete-region" title="删除区域">删除区域</button>
        
        <!-- 最小化按钮 -->
        <button class="floating-collapse-btn" id="floating-collapse-btn" title="最小化">▼</button>
    </div>
</div>
