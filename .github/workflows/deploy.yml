name: deploy
on:
  push:
    branches:
      - deploy
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  buildAndPushAndDeploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get short commit hash
        id: get-sha
        run: echo "DOCKERTAG=ghcr.io/transhistoria/transhistoria:$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: build docker container and push
        env:
          DOCKERTAG: ${{ env.DOCKERTAG }}
        run: docker build -t ${DOCKERTAG} && docker push ${DOCKERTAG}
      - name: Call deploy API (notify)
        env:
          DOCKERTAG: ${{ env.DOCKERTAG }}
        run: |
          set -e
          if [ -z "${{ secrets.DEPLOY_API_URL }}" ]; then
            echo "secrets.DEPLOY_API_URL is not set!"
            echo "skip deploy api"
            exit 0
          fi
          URL="${{ secrets.DEPLOY_API_URL }}${TAG}"
          echo "Calling deploy URL..."
          curl -sSf "$URL" -o /tmp/deploy_response || {
            echo "Deploy API request failed. Response (if any):"
            cat /tmp/deploy_response || true
            exit 0
          }