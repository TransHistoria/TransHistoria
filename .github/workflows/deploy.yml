name: deploy
on:
  workflow_dispatch:
  push:
    branches:
      - deploy
permissions:
  contents: write
  packages: write
jobs:
  buildAndPushAndDeploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: get tags
        id: getTags
        run: echo "tags<<EOF">>$GITHUB_OUTPUT;echo $(git rev-parse --short HEAD)>>$GITHUB_OUTPUT;echo latest>>$GITHUB_OUTPUT;echo EOF>>$GITHUB_OUTPUT
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/transhistoria/transhistoria
          tags: ${{ steps.getTags.outputs.tags }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Call deploy API (notify)
        env:
          API: ${{ secrets.DEPLOY_API_URL }}
          ARG: ${{ secrets.DEPLOY_API_PARAM }}
        run: curl -sSf "${API}" "${ARG}" || echo "[skip deploy]"